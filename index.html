/* =====================================================
   SHIFT
===================================================== */

function getCurrentShift(){

const t=
new Date().getHours()*60+
new Date().getMinutes();

if(t>=465 && t<975)
return "A";

if(t>=975 && t<1440)
return "B";

return "C";

}

function getShiftRange(s){

if(s=="A")
return "7:45 AM - 4:15 PM";

if(s=="B")
return "4:15 PM - 12:00 AM";

return "12:00 AM - 7:45 AM";

}


/* =====================================================
   SHIFT AUTO RESET
===================================================== */

function checkShiftAutoReset(){

let saved=localStorage.getItem("brembo_shift");

let live=getCurrentShift();

const badge=
document.getElementById("liveShiftBadge");

if(badge)
badge.innerText="SHIFT: "+live;

const at=
document.getElementById("autoShiftTxt");

if(at)
at.innerText=
"Current Running Shift: "+
live+
" ("+
getShiftRange(live)+
") Auto";

if(
saved &&
saved!==live &&
operator
){

alert(
"Shift "+
saved+
" Ended! Shift "+
live+
" Started. Auto Reset & Logout."
);

for(let k in machines){

machines[k]={
status:"RUNNING",
op:null
};

}

db.ref("machines").set(machines)
.then(()=>{

localStorage.removeItem("brembo_v7");
localStorage.removeItem("brembo_shift");
localStorage.removeItem("brembo_login_time");

location.reload();

});

return true;

}

return false;

}

setInterval(checkShiftAutoReset,30000);

for(let i=1;i<=35;i++)

[

for(let i=1;i<=4;i++)

for(let i=1;i<=3;i++)

return a;

let m={};

ALL_MACHINES_LIST.forEach((id,idx)=>{

let s=
idx%7==1
?"BREAKDOWN"
:
idx%7==2
?"CMM NOT OK"
:
idx%7==3
?"FIXTURE NOT OK"
:
idx%7==4
?"LOT READY"
:
idx%7==5
?"LOT HOLD"
:
"RUNNING";

m[id]={
status:s,
op:null
};

});

return m;

}


/* =====================================================
   SAVE
===================================================== */

function save(){

db.ref("machines").set(machines);

}


/* =====================================================
   RESET ALL
===================================================== */

function resetAll(){

let pin=prompt("ENTER ADMIN PIN:");

if(pin===null)
return;

if(pin!==ADMIN_PIN){

alert("Wrong PIN! Access Denied!");
return;

}

if(
!confirm(

)

for(let k in machines){

op:null
};

/* =====================================================

===================================================== */

function load(){

db.ref("machines").on("value",s=>{

let d=s.val();

let all=getAllMachines();

if(d){

let needSave=false;

for(let k in all){

if(!d[k]){

d[k]=all[k];
needSave=true;

}

}

for(let k in d){

if(k.includes("-")){

delete d[k];
needSave=true;

}

}

machines=d;

if(needSave)
save();

for(let id in d){

if(
prev[id] &&
prev[id].status!=d[id].status
){

let who=
d[id].op
?
d[id].op.name
:
"Someone";

let route=
ROUTE_MAP[d[id].status]
||
ROUTE_MAP["RUNNING"];

loudPopup(
id,
d[id].status,
who,
route
);

}

}

prev=
JSON.parse(
JSON.stringify(d)
);

const fb=
document.getElementById("fbStat");

if(fb)
fb.innerText=
"LIVE - "+
Object.keys(machines).length+
" M/C";

render();

renderDepartmentDashboard();

}else{

machines=getAllMachines();

save();

}

});

}

/* =====================================================
   DEPARTMENT DASHBOARD RENDER
===================================================== */

function renderDepartmentDashboard(){

if(!department)
return;

const config=
DEPARTMENT_CONFIG[department];

if(!config)
return;

document.getElementById(
"deptTitle"
).innerText=
config.name+
" DASHBOARD";

document.getElementById(
"deptBadge"
).innerText=
config.name;


/* TOTAL */

document.getElementById(
"deptTotal"
).innerText=
Object.keys(machines).length;


/* RUNNING */

let running=
Object.values(machines)
.filter(
m=>m.status==="RUNNING"
)
.length;

document.getElementById(
"deptRunning"
).innerText=
running;


/* ISSUE (Shows Active Department Issue or All Non-Running) */

let issue=
Object.values(machines)
.filter(
m => config.issueStatus ? m.status === config.issueStatus : m.status !== "RUNNING"
)
.length;

document.getElementById(
"deptIssue"
).innerText=
issue;


/* FILTER MACHINES LOGIC */

let filteredList = ALL_MACHINES_LIST.filter(id => {
  const m = machines[id] || { status: "RUNNING" };
  
  // 1. Series Filter
  let matchSeries = (deptSeriesFilter === "ALL") || id.startsWith(deptSeriesFilter);
  
  // 2. Status Filter
  let matchStatus = true;
  if(deptStatusFilter === "RUNNING") {
    matchStatus = (m.status === "RUNNING");
  } else if(deptStatusFilter === "ISSUE") {
    matchStatus = config.issueStatus ? (m.status === config.issueStatus) : (m.status !== "RUNNING");
  }

  return matchSeries && matchStatus;
});

// Grid Title Text
document.getElementById("deptGridTitle").innerText = `SELECT MACHINE (${filteredList.length})`;


/* MACHINE GRID RENDER */

const grid=
document.getElementById(
"deptMachineGrid"
);

if(filteredList.length === 0){
  grid.innerHTML = `<div style="grid-column: span 3; text-align: center; color: #aaa; font-size: 13px; padding: 20px;">No Machines Found</div>`;
} else {
  grid.innerHTML=
  filteredList
  .map(id=>{

  const m=
  machines[id] ||
  {
  status:"RUNNING",
  op:null
  };

  const selected=
  deptSelectedMachine===id
  ?
  "selected"
  :
  "";

  const statusColor=
  m.status==="RUNNING"
  ?
  "#22c55e"
  :
  "#ef4444";

  return `

  <div
  class="deptMachine ${selected}"
  onclick="selectDepartmentMachine('${id}')">

  ${id}

  <span
  class="deptMachineStatus"
  style="color:${statusColor}">

  ${m.status}

  </span>

  </div>

  `;

  })
  .join("");
}

renderDepartmentSelected();

}

/* =====================================================
   DEPARTMENT UPDATE
===================================================== */

function departmentUpdateStatus(status){

if(!department){

alert(
"Department login required."
);

return;

}

const config=
DEPARTMENT_CONFIG[department];


/* PERMISSION CHECK */

const allowed=
config.actions.some(
a=>a.status===status
);

if(!allowed){

alert(
"Access denied. This action is not allowed for your department."
);

return;

}

if(!deptSelectedMachine){

alert(
"Please select a machine first."
);

return;

}

const id=
deptSelectedMachine;


/* MAINTENANCE */

if(
department==="maintenance"
){

if(status==="BREAKDOWN"){

if(
!confirm(
`Set ${id} to BREAKDOWN ON?`
)
)
return;

}else{

if(
!confirm(
`Set ${id} to BREAKDOWN OFF?`
)
)
return;

}

}


/* LOADING */

if(
department==="loading"
){

if(status==="LOT READY"){

if(
!confirm(
`Set ${id} to LOT READY?`
)
)
return;

}else{

if(
!confirm(
`Mark ${id} as DONE?`
)
)
return;

}

}


/* QUALITY */

if(
department==="quality"
){

if(status==="CMM NOT OK"){

if(
!confirm(
`Set ${id} to CMM NOT OK?`
)
)
return;

}else{

if(
!confirm(
`Mark ${id} as OK?`
)
)
return;

}

}


/* UPDATE */

machines[id].status=status;

save();


/* ROUTE */

let route=
ROUTE_MAP[status] ||
ROUTE_MAP["RUNNING"];


/* NOTIFICATION */

let who=
department.toUpperCase()+
" DEPARTMENT";

loudPopup(
id,
status,
who,
route
);


/* WHATSAPP */

if(
status!=="RUNNING"
){

let msg=
`*🚨 BREMBO V8 ALERT*%0A%0A`+
`Machine: ${id}%0A`+
`Status: *${status}*%0A`+
`Department: ${config.name}%0A`+
`Time: ${new Date().toLocaleString("en-IN")}%0A%0A`+
`Action Required By: ${route.name}`;

lastWa=
`https://wa.me/${route.no}?text=${msg}`;

setTimeout(
()=>{
window.open(
lastWa,
"_blank"
);
},
700
);

}

renderDepartmentDashboard();

}

loudPopup(
curMachine,
s,
operator.name,
route
);

let date=
new Date()
.toLocaleString("en-IN");

let msg=
`*🚨 BREMBO ALERT V8*%0A%0A`+
`Machine: ${curMachine}%0A`+
`Status: *${s}*%0A`+
`Operator: ${operator.name}%0A`+
`ID: ${operator.id}%0A`+
`Shift: ${operator.shift} (${getShiftRange(operator.shift)})%0A`+
`Time: ${date}%0A%0A`+
`Action Required By: ${route.name}`;

lastWa=
`https://wa.me/${route.no}?text=${msg}`;

document.getElementById(
"routeInfo"
).style.display="block";

document.getElementById(
"routeInfo"
).innerHTML=`

<b>WhatsApp will go to:</b>

<br>

👉 ${route.name}

<br>

📱 ${route.no}

`;

document.getElementById(
"waBtn"
).style.display="block";

document.getElementById(
"waBtn"
).innerText=
`SEND TO ${route.name.toUpperCase()}`;

setTimeout(
()=>{
window.open(
lastWa,
"_blank"
);
},
700
);

renderCards();

renderList();

}


/* =====================================================
   MAIN RENDER
===================================================== */

function render(){

if(
!operator &&
!department
)
return;

if(operator){

document.getElementById(
"operatorDashboard"
).style.display="block";

document.getElementById(
"departmentDashboard"
).style.display="none";

renderCards();

renderList();

if(curMachine)
sel(curMachine);

}

if(department){

document.getElementById(
"operatorDashboard"
).style.display="none";

document.getElementById(
"departmentDashboard"
).style.display="block";

renderDepartmentDashboard();

}

}


/* =====================================================
   START
===================================================== */

fillMachineDropdown();

load();


/* =====================================================
   RESTORE LOGIN
===================================================== */

let savedOperator=
localStorage.getItem("brembo_v7");

let savedDepartment=
localStorage.getItem(
"brembo_department"
);


/* DEPARTMENT RESTORE */

if(savedDepartment){

if(
DEPARTMENT_CONFIG[savedDepartment]
){

department=savedDepartment;

operator=null;

document.getElementById(
"login"
).style.display="none";

document.getElementById(
"operatorDashboard"
).style.display="none";

document.getElementById(
"departmentDashboard"
).style.display="block";

deptSelectedMachine=
ALL_MACHINES_LIST[0];

renderDepartmentDashboard();

}

}


/* OPERATOR RESTORE */

else if(savedOperator){

try{

operator=
JSON.parse(savedOperator);

if(!operator.machine){

document.getElementById(
"login"
).style.display="flex";

localStorage.removeItem(
"brembo_v7"
);

}else{

if(
!checkShiftAutoReset()
){

document.getElementById(
"login"
).style.display="none";

document.getElementById(
"operatorDashboard"
).style.display="block";

applyOperator();

}

}

}catch(e){

localStorage.removeItem(
"brembo_v7"
);

}

}


/* SERVICE WORKER */

if(
"serviceWorker"
in navigator
){

navigator.serviceWorker.register(
"sw.js"
);

}

</script>

</body>
</html>
