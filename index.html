<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brembo - Final Operator System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#080c1c;color:#fff}
#login{position:fixed;inset:0;background:#080c1c;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#111a33;border:1px solid #1e2c5a;border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center}
.inp{width:100%;padding:13px;border-radius:10px;background:#080c1c;border:1.5px solid #233363;color:#fff;margin:8px 0}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:#ff1a1a;color:#fff;font-weight:900;cursor:pointer}
.top{display:flex;justify-content:space-between;padding:10px 14px;background:#0c122b;border-bottom:1px solid #1a2650}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;max-width:1200px;margin:auto}
.c{background:#111a33;border-radius:14px;padding:12px;text-align:center;border:1px solid #1e2c5a;cursor:pointer}
.c.active{border:2px solid #fff;transform:scale(1.03)}
.c h3{font-size:22px}
.c p{font-size:9px;opacity:.7;letter-spacing:1px}
.sGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px;max-width:1200px;margin:auto}
.s{background:#111a33;padding:12px;border-radius:14px;border:1px solid #1e2c5a;cursor:pointer}
.mobWrap{background:#eef2ff;border-radius:18px;padding:14px;margin:14px 12px;color:#000;max-width:1200px;margin:auto;margin-top:16px}
.mobGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.phone{background:#0a0e1f;border-radius:18px;padding:10px;min-height:420px;color:#fff;border:2px solid #222}
.opt{padding:8px 9px;background:#141e3b;border-radius:8px;margin:4px 0;font-size:11px;display:flex;justify-content:space-between;cursor:pointer;border:1px solid #22305c}
.opt.sel{background:#fff;color:#000;font-weight:900}
.opInfo{background:#1a254a;padding:10px;border-radius:10px;margin-top:10px;font-size:11px;line-height:1.6}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.sGrid{grid-template-columns:repeat(1,1fr)}.mobGrid{grid-template-columns:repeat(1,1fr)}}
</style>
</head>
<body>
<div id="login">
<div class="box">
<h2 style="color:#ff1a1a;font-weight:900;font-size:28px">brembo</h2>
<p style="font-size:10px;letter-spacing:3px;color:#7a85a6;margin-bottom:16px">OPERATOR LOGIN SYSTEM</p>
<input id="opId" class="inp" placeholder="ID टाका - उदा. 1011">
<input id="opName" class="inp" placeholder="नाव टाका - उदा. Akash Patil">
<select id="opShift" class="inp"><option>Day Shift (7-7)</option><option>Night Shift (7-7)</option><option>General</option></select>
<button class="btn" onclick="login()">LOGIN →</button>
<p id="err" style="color:#ff4444;font-size:11px;margin-top:8px"></p>
</div>
</div>
<div class="top"><div><b style="color:#ff1a1a">brembo</b> <span id="wel" style="font-size:11px;color:#22c55e;margin-left:10px"></span></div><button onclick="logout()" style="background:#1a254a;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:10px">LOGOUT</button></div>
<div class="cards" id="topCards"></div>
<div class="sGrid" id="sGrid"></div>
<div class="mobWrap">
<div style="text-align:center;font-weight:900;font-size:13px;margin-bottom:10px;letter-spacing:1px">OPERATOR MOBILE FLOW - FINAL</div>
<div class="mobGrid">
<div class="phone"><b>1. Select Series</b><div id="pSeries" style="margin-top:10px"></div></div>
<div class="phone"><b id="mTitle">2. Machines</b><div id="pMachines" style="margin-top:10px"></div></div>
<div class="phone"><b>3. Selected Machine</b><div id="pSel" style="margin-top:10px"></div><div id="opInfoBox"></div></div>
<div class="phone"><b>4. Update Status</b><div id="pStatus" style="margin-top:10px"></div></div>
</div>
</div>
<script>
const REAL_NUMS={SUPERVISOR:"919881097236",MAINT:"919822434776",TOOL:"919359499867",LOADING:"919012683322"};
let curSeries='E',curMachine='E-06',curFilter='ALL',operator=null;
let machines={};
function initMachines(){
  for(let i=1;i<=14;i++){let id='M1-'+String(i).padStart(2,'0');machines[id]={status:'RUNNING',op:null};}
  for(let i=1;i<=32;i++){let id='E-'+String(i).padStart(2,'0');let s=i<=20?'RUNNING':i<=24?'BREAKDOWN':i<=28?'CMM NOT OK':i<=30?'FIXTURE NOT OK':'LOT READY';machines[id]={status:s,op:null};}
  for(let i=1;i<=8;i++){machines['MK-0'+i]={status:'RUNNING',op:null};}
  for(let i=1;i<=4;i++){machines['PN-0'+i]={status:'RUNNING',op:null};machines['L-0'+i]={status:'RUNNING',op:null};}
  for(let i=1;i<=3;i++){machines['BR-0'+i]={status:'RUNNING',op:null};}
  machines['E-01'].op={name:'Rohit K.',id:'1001',shift:'Day'};machines['E-06'].op={name:'Akash P.',id:'1011',shift:'Day'};
}
function login(){
  let id=document.getElementById('opId').value.trim(),name=document.getElementById('opName').value.trim();
  if(!id||!name){document.getElementById('err').innerText='ID आणि नाव टाका!';return;}
  operator={id,name,shift:document.getElementById('opShift').value,time:new Date().toLocaleTimeString()};
  localStorage.setItem('brembo_op_final',JSON.stringify(operator));
  document.getElementById('login').style.display='none';
  document.getElementById('wel').innerText='👷 '+name+' (ID:'+id+') | '+operator.shift;
  renderAll();
}
function logout(){localStorage.removeItem('brembo_op_final');location.reload();}
function renderTop(){
  let total=Object.keys(machines).length;
  let run=Object.values(machines).filter(m=>m.status=='RUNNING').length;
  let br=Object.values(machines).filter(m=>m.status=='BREAKDOWN').length;
  let cmm=Object.values(machines).filter(m=>m.status=='CMM NOT OK').length;
  let fix=Object.values(machines).filter(m=>m.status=='FIXTURE NOT OK').length;
  let lot=Object.values(machines).filter(m=>m.status=='LOT READY').length;
  let cards=[
    {k:'ALL',t:'TOTAL',v:total,c:'#60a5fa'},
    {k:'RUNNING',t:'RUNNING',v:run,c:'#22c55e'},
    {k:'BREAKDOWN',t:'BREAKDOWN',v:br,c:'#ef4444'},
    {k:'CMM NOT OK',t:'CMM NOT OK',v:cmm,c:'#f59e0b'},
    {k:'FIXTURE NOT OK',t:'FIXTURE NOT OK',v:fix,c:'#fbbf24'},
    {k:'LOT READY',t:'LOT READY',v:lot,c:'#22c55e'}
  ];
  document.getElementById('topCards').innerHTML=cards.map(x=>`<div class="c ${curFilter==x.k?'active':''}" onclick="setFilter('${x.k}')" style="border-left:4px solid ${x.c}"><p>${x.t}</p><h3 style="color:${x.c}">${x.v}</h3><p style="font-size:8px">CLICK TO VIEW LIST →</p></div>`).join('');
}
function setFilter(f){curFilter=f;renderTop();renderMachineList();}
function renderSeries(){
  let list=[{id:'M1',n:'M1 SERIES',c:14},{id:'E',n:'E SERIES',c:32},{id:'MK',n:'MK SERIES',c:8},{id:'PN',n:'PN SERIES',c:4},{id:'L',n:'L SERIES',c:4},{id:'BR',n:'BR SERIES',c:3}];
  document.getElementById('sGrid').innerHTML=list.map(s=>`<div class="s" onclick="selSeries('${s.id}')" style="${curSeries==s.id?'border:2px solid #fff':''}"><b>${s.n}</b><div style="font-size:11px;opacity:.7">${s.c} Machines</div></div>`).join('');
  document.getElementById('pSeries').innerHTML=list.map(s=>`<div class="opt ${curSeries==s.id?'sel':''}" onclick="selSeries('${s.id}')"><span>${s.n} (${s.c})</span><span>→</span></div>`).join('');
}
function selSeries(id){curSeries=id;curFilter='ALL';renderTop();renderSeries();renderMachineList();}
function renderMachineList(){
  let ids=Object.keys(machines).filter(k=>k.startsWith(curSeries+'-')).sort();
  if(curFilter!='ALL'){ids=ids.filter(k=>machines[k].status==curFilter);}
  document.getElementById('mTitle').innerText=curSeries+' SERIES - '+curFilter+' ('+ids.length+')';
  document.getElementById('pMachines').innerHTML=ids.map(id=>`<div class="opt ${id==curMachine?'sel':''}" onclick="selMachine('${id}')"><span>${id}</span><span style="font-size:9px;padding:2px 5px;border-radius:4px;background:${machines[id].status=='RUNNING'?'#22c55e':'#ef4444'}">${machines[id].status}</span></div>`).join('')||'<div style="font-size:11px;opacity:.6">या Status ची Machine नाही</div>';
  selMachine(curMachine,false);
}
function selMachine(id,doAssign=true){
  if(!machines[id]) id=Object.keys(machines).filter(k=>k.startsWith(curSeries+'-'))[0];
  curMachine=id;
  if(doAssign && operator &&!machines[id].op){
    machines[id].op={name:operator.name,id:operator.id,shift:operator.shift,time:new Date().toLocaleTimeString()};
  }
  document.getElementById('pSel').innerHTML=`<div style="font-size:28px;font-weight:900;color:#22c55e">${id}</div><div style="font-size:11px;margin-top:6px">Status: <b>${machines[id].status}</b></div><button style="margin-top:10px;width:100%;padding:10px;border:none;border-radius:8px;background:#22c55e;font-weight:900" onclick="assignMe('${id}')">I AM WORKING HERE - माझं नाव लावा</button>`;
  let op=machines[id].op;
  if(op){
    document.getElementById('opInfoBox').innerHTML=`<div class="opInfo">👷 <b>काम करणारा:</b><br>नाव: ${op.name}<br>ID: ${op.id}<br>Shift: ${op.shift}<br>वेळ: ${op.time||'आज'}<br>Status: ${machines[id].status}</div>`;
  }else{
    document.getElementById('opInfoBox').innerHTML=`<div class="opInfo" style="background:#2a1a1a">⚠️ कोणीच Operator नाही<br>कोणी काम करत नाहीय</div>`;
  }
  renderStatusBtns();
}
function assignMe(id){if(!operator){alert('Login करा!');return;}machines[id].op={name:operator.name,id:operator.id,shift:operator.shift,time:new Date().toLocaleTimeString()};selMachine(id,false);alert('तुझं नाव '+id+' वर लागलं!');}
function renderStatusBtns(){
  let sts=['RUNNING','BREAKDOWN','CMM NOT OK','FIXTURE NOT OK','LOT HOLD','LOT READY'];
  document.getElementById('pStatus').innerHTML=sts.map(s=>`<div class="opt" style="${machines[curMachine].status==s?'background:#fff;color:#000;font-weight:900':''}" onclick="changeStatus('${s}')"><span>● ${s}</span><span>${s==machines[curMachine].status?'✓':''}</span></div>`).join('')+`<div style="font-size:9px;color:#7a85a6;margin-top:10px">WhatsApp Real Numbers वर जाईल<br>Operator: ${operator?operator.name:'-'}</div>`;
}
function changeStatus(s){
  if(!operator){alert('पहिला Login कर!');document.getElementById('login').style.display='flex';return;}
  machines[curMachine].status=s;
  if(!machines[curMachine].op) machines[curMachine].op={name:operator.name,id:operator.id,shift:operator.shift,time:new Date().toLocaleTimeString()};
  renderTop();renderMachineList();
  let msg=`*BREMBO ALERT*%0AMachine: ${curMachine}%0AProblem: ${s}%0AOperator: ${operator.name} (ID:${operator.id})%0AShift: ${operator.shift}%0ATime: ${new Date().toLocaleString()}`;
  let target=REAL_NUMS.SUPERVISOR;
  if(s=='BREAKDOWN')target=REAL_NUMS.MAINT;else if(s=='FIXTURE NOT OK')target=REAL_NUMS.TOOL;else if(s.includes('LOT'))target=REAL_NUMS.LOADING;
  window.open(`https://wa.me/${target}?text=${msg}`,'_blank');
  setTimeout(()=>{if(target!=REAL_NUMS.SUPERVISOR)window.open(`https://wa.me/${REAL_NUMS.SUPERVISOR}?text=${msg}`,'_blank');},1000);
}
function renderAll(){renderTop();renderSeries();renderMachineList();}
initMachines();
let saved=localStorage.getItem('brembo_op_final');
if(saved){operator=JSON.parse(saved);document.getElementById('login').style.display='none';document.getElementById('wel').innerText='👷 '+operator.name+' (ID:'+operator.id+')';document.getElementById('opId').value=operator.id;document.getElementById('opName').value=operator.name;}
renderAll();
</script>
</body>
</html>
