<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Brembo - 69 Machines</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body{
background:#05070a;
background-image: radial-gradient(circle at center, #111827 0%, #05070a 100%);
color:#f1f5f9;
}

button{
cursor:pointer;
transition: all 0.2s ease;
}

#login{
position:fixed;
inset:0;
background: radial-gradient(circle at center, #0c1017 0%, #030406 100%);
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:auto;
}

/* हुबेहूब इमेज प्रमाणे Neon Red Glow Card Box */
.loginBox{
background: linear-gradient(145deg, #0d121c 0%, #06090f 100%);
padding:45px 35px;
border-radius:32px;
width:460px;
max-width:100%;
text-align:center;
border:1.5px solid rgba(255, 0, 0, 0.6);
box-shadow: 0 0 50px rgba(255, 0, 0, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.9);
}

.brandLogo {
width: 260px;
height: auto;
margin: 0 auto 8px auto;
display: block;
filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
}

.topBarLogo {
width: 130px;
height: auto;
display: inline-block;
vertical-align: middle;
filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.4));
}

.loginSub{
font-size:11px;
color:#94a3b8;
margin-bottom:18px;
letter-spacing:3.5px;
font-weight:700;
text-transform: uppercase;
}

/* इमेजमधील ग्लोइंग रेड डिवाईडर लाईन */
.glow-divider {
height: 2px;
background: linear-gradient(90deg, transparent, #ff0000, transparent);
margin: 0 auto 25px auto;
width: 90%;
box-shadow: 0 0 12px #ff0000, 0 0 20px #ff0000;
}

/* FORM INPUTS & SELECT BOXES */
.loginInput,
.loginSelect{
width:100%;
height:52px;
padding:0 16px;
margin:8px 0;
border-radius:12px;
font-size:14px;
font-weight:600;
outline:none;
box-sizing:border-box;
transition: border-color 0.2s, box-shadow 0.2s;
}

.loginInput{
background:#090d16;
color:#ffffff;
border:1px solid #1e293b;
}

.loginInput:focus{
border-color:#ff1a1a;
box-shadow: 0 0 12px rgba(255, 26, 26, 0.5);
}

.loginSelect{
background:#090d16;
color:#ffffff;
border:1px solid #1e293b;
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background-image: url("data:image/svg+xml;utf8,<svg fill='%2394a3b8' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
background-repeat: no-repeat;
background-position-x: 95%;
background-position-y: 50%;
}

.loginSelect:focus{
border-color:#ff1a1a;
box-shadow: 0 0 12px rgba(255, 26, 26, 0.5);
}

.loginSelect option{
background:#0d1424;
color:#fff;
padding:10px;
}

/* ऑपरेटर लॉगिन बटन */
.loginBtn{
width:100%;
height:54px;
background: linear-gradient(180deg, #ff1a1a 0%, #b30000 100%);
color:#fff;
border:1px solid rgba(255, 255, 255, 0.25);
border-radius:16px;
font-weight:900;
font-size:16px;
margin-top:18px;
box-shadow: 0 6px 22px rgba(255, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4);
letter-spacing:1.5px;
text-transform: uppercase;
}

.loginBtn:hover{
transform: translateY(-2px);
box-shadow: 0 8px 28px rgba(255, 0, 0, 0.8);
}

.loginBtn:active{
transform: translateY(1px);
}

.modeBar{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:18px;
background:#05070a;
padding:4px;
border-radius:12px;
border:1px solid #1e293b;
}

.modeBtn{
padding:10px;
border-radius:9px;
border:none;
background:transparent;
color:#94a3b8;
font-weight:800;
font-size:12px;
letter-spacing:0.5px;
}

.modeBtn.active{
background:#ff1a1a;
color:#ffffff;
box-shadow: 0 0 10px rgba(255, 26, 26, 0.6);
}

.departmentLogin{
display:none
}

#notifBig{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#ff1a1a;
color:#fff;
padding:30px;
border-radius:20px;
font-weight:900;
font-size:20px;
display:none;
z-index:99999;
text-align:center;
box-shadow:0 0 50px rgba(255, 26, 26, 0.8);
border:3px solid #fff;
max-width:90%
}

/* CUSTOM MATERIAL SHORTAGE MODAL */
#materialModal{
position:fixed;
inset:0;
background:rgba(5, 7, 10, 0.9);
backdrop-filter: blur(8px);
z-index:999999;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modalContent{
background:#0d121c;
padding:26px;
border-radius:24px;
width:400px;
max-width:100%;
border:1px solid #ec4899;
box-shadow:0 0 35px rgba(236,72,153,0.3);
}

.topBar{
padding:14px 16px;
background:#080b12;
display:flex;
justify-content:space-between;
position:sticky;
top:0;
z-index:50;
align-items:center;
gap:10px;
border-bottom:1px solid rgba(255, 26, 26, 0.3);
}

.seriesBar{
padding:10px;
background:#121a2d;
display:flex;
gap:8px;
overflow:auto
}

.sBtn{
padding:8px 16px;
border-radius:20px;
border:1px solid #2a364f;
background:#090d16;
color:#94a3b8;
font-size:12px;
font-weight:700;
white-space:nowrap
}

.sBtn.active{
background:#ff1a1a;
color:#fff;
border-color:#ff1a1a;
box-shadow: 0 0 8px rgba(255, 26, 26, 0.5);
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:12px
}

.card{
background:#121a2d;
border:1px solid #1e293b;
border-radius:14px;
padding:14px 10px;
text-align:center;
cursor:pointer
}

.card:hover{
border-color:#ff1a1a;
}

.mainBox{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:12px
}

.phone{
background:#121a2d;
border:1px solid #1e293b;
border-radius:16px;
padding:16px
}

.mItem{
padding:12px;
background:#1a243b;
border-radius:10px;
margin:6px 0;
display:flex;
justify-content:space-between;
cursor:pointer;
font-size:13px;
border:1px solid transparent;
}

.mItem.active{
border-color:#ff1a1a;
background:#222f4d;
box-shadow: 0 0 10px rgba(255, 26, 26, 0.3);
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-weight:800;
margin-top:10px;
cursor:pointer
}

.viewBox{
background:#121a2d;
border:1px solid #22c55e;
padding:12px;
border-radius:10px;
margin:10px 0;
line-height:1.8
}

/* DEPARTMENT DASHBOARD */
#departmentDashboard{
display:none
}

.deptHeader{
padding:16px;
background:#080b12;
border-bottom:1px solid rgba(255, 26, 26, 0.3);
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
position:sticky;
top:0;
z-index:100
}

.deptTitle{
font-size:20px;
font-weight:900
}

.deptBadge{
padding:6px 12px;
border-radius:20px;
font-size:11px;
font-weight:800;
background:#ff1a1a;
color:#fff;
box-shadow:0 0 8px rgba(255, 26, 26, 0.5);
}

.deptContent{
padding:12px;
max-width:900px;
margin:auto
}

.deptStats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:12px
}

.deptStat{
background:#121a2d;
border:1px solid #1e293b;
border-radius:14px;
padding:14px;
text-align:center;
cursor:pointer;
}

.deptStat.active{
border-color:#ff1a1a;
background:#1a243b
}

.deptStat small{
display:block;
font-size:10px;
color:#94a3b8;
margin-bottom:4px;
font-weight:700;
}

.deptStat b{
font-size:24px
}

.deptMachineBox{
background:#121a2d;
border:1px solid #1e293b;
border-radius:16px;
padding:16px;
margin-bottom:12px
}

.deptMachineGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
max-height:420px;
overflow:auto;
margin-top:12px
}

.deptMachine{
background:#1a243b;
border:1px solid #2a364f;
padding:12px 6px;
border-radius:10px;
text-align:center;
font-weight:800;
font-size:13px;
cursor:pointer
}

.deptMachine.selected{
border-color:#ff1a1a;
background:#222f4d
}

.deptMachineStatus{
display:block;
font-size:9px;
margin-top:4px;
color:#22c55e
}

.deptSelected{
background:#090d16;
border:1px solid #2a364f;
border-radius:12px;
padding:16px;
margin-top:12px
}

.deptSelected h2{
font-size:26px;
margin-bottom:6px
}

.actionGrid{
display:grid;
grid-template-columns:1fr;
gap:10px;
margin-top:14px
}

.actionBtn{
padding:16px;
border:none;
border-radius:12px;
font-weight:800;
font-size:14px;
cursor:pointer
}

.breakOff{ background:#22c55e; color:#000 }
.lotTaken{ background:#22c55e; color:#000 }
.cmmOk{ background:#22c55e; color:#000 }
.fixtureOk{ background:#22c55e; color:#000 }
.materialSupplied{ background:#22c55e; color:#000 }

.viewOnly{
background:#1a243b;
border:1px solid #64748b;
padding:20px;
border-radius:12px;
text-align:center;
margin-top:12px
}

.smallNote{
font-size:11px;
color:#94a3b8;
margin-top:10px;
line-height:1.5
}

@media(max-width:700px){
.topBar{ align-items:flex-start }
.cards{ grid-template-columns:repeat(4,1fr) }
.mainBox{ grid-template-columns:1fr }
.deptMachineGrid{ grid-template-columns:repeat(3,1fr) }
}

@media(max-width:450px){
.deptMachineGrid{ grid-template-columns:repeat(3,1fr) }
.actionGrid{ grid-template-columns:1fr }
.deptStats{ grid-template-columns:repeat(3,1fr) }
}
</style>
</head>

<body>

<div id="notifBig"></div>

<!-- MATERIAL SHORTAGE MODAL -->
<div id="materialModal">
<div class="modalContent">
<h2 style="color:#ec4899;font-weight:900;font-size:18px;margin-bottom:14px;text-align:center">MATERIAL SHORTAGE DETAILS</h2>
<input id="matPartNo" class="loginInput" placeholder="PART NO">
<input id="matPartName" class="loginInput" placeholder="PART NAME">
<input id="matQty" type="number" class="loginInput" placeholder="QUANTITY">
<button onclick="submitMaterialShortage()" class="loginBtn" style="background:linear-gradient(135deg, #ec4899 0%, #db2777 100%);box-shadow:0 4px 14px rgba(236, 72, 153, 0.35)">SUBMIT & SEND ALERT</button>
<button onclick="closeMaterialModal()" class="loginBtn" style="background:#1e293b;color:#fff;margin-top:8px;box-shadow:none">CANCEL</button>
</div>
</div>

<!-- LOGIN -->
<div id="login">
<div class="loginBox">
<!-- Brembo High Quality SVG Logo -->
<svg class="brandLogo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 45">
  <g fill="#FF1A1A">
    <path d="M32.5 7.5 C 24.5 7.5 18 14 18 22 C 18 30 24.5 36.5 32.5 36.5 C 40.5 36.5 47 30 47 22 C 47 14 40.5 7.5 32.5 7.5 Z M 32.5 29 C 28.6 29 25.5 25.9 25.5 22 C 25.5 18.1 28.6 15 32.5 15 C 36.4 15 39.5 18.1 39.5 22 C 39.5 25.9 36.4 29 32.5 29 Z"/>
    <path d="M12.5 7.5 C 5.6 7.5 0 13.1 0 20 L 0 36.5 L 7.5 36.5 L 7.5 20 C 7.5 17.2 9.7 15 12.5 15 C 15.3 15 17.5 17.2 17.5 20 L 17.5 36.5 L 25 36.5 L 25 20 C 25 13.1 19.4 7.5 12.5 7.5 Z"/>
  </g>
  <text x="55" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#FF1A1A" letter-spacing="-1">brembo</text>
</svg>
<p class="loginSub">OFFICIAL HIGH PERFORMANCE</p>
<div class="glow-divider"></div>

<div class="modeBar">
<button id="operatorModeBtn" class="modeBtn active" onclick="showLoginMode('operator')">OPERATOR</button>
<button id="departmentModeBtn" class="modeBtn" onclick="showLoginMode('department')">DEPARTMENT</button>
</div>

<!-- OPERATOR LOGIN -->
<div id="operatorLogin">
<input id="opId" class="loginInput" placeholder="EMPLOYEE ID">
<input id="opName" class="loginInput" placeholder="EMPLOYEE NAME">
<input id="opPin" type="password" class="loginInput" placeholder="OPERATOR PIN">
<select id="opMachine" class="loginSelect"></select>
<select id="opShift" class="loginSelect" style="border-color:#eab308">
<option value="A">Shift A (7:45 AM - 4:15 PM)</option>
<option value="B">Shift B (4:15 PM - 12:00 AM)</option>
<option value="C">Shift C (12:00 AM - 7:45 AM)</option>
</select>
<p id="autoShiftTxt" style="font-size:11px;color:#22c55e;margin-top:8px;font-weight:700"></p>
<button onclick="doLogin()" class="loginBtn">OPERATOR LOGIN</button>
</div>

<!-- DEPARTMENT LOGIN -->
<div id="departmentLogin">
<select id="departmentSelect" class="loginSelect">
<option value="">-- SELECT DEPARTMENT --</option>
<option value="maintenance">Maintenance</option>
<option value="loading">Loading</option>
<option value="quality">Quality</option>
<option value="toolroom">Tool Room</option>
<option value="store">Store Department</option>
<option value="supervisor">Supervisor</option>
</select>
<input id="departmentPin" type="password" class="loginInput" placeholder="DEPARTMENT PIN">
<button onclick="departmentLogin()" class="loginBtn">DEPARTMENT LOGIN</button>
<div class="smallNote">Authorized department access only.</div>
</div>
<p id="fbStat" style="font-size:11px;color:#eab308;margin-top:14px;font-weight:600">Connecting LIVE...</p>
</div>
</div>

<!-- OPERATOR DASHBOARD -->
<div id="operatorDashboard">
<div class="topBar">
<div>
<!-- Brembo Topbar SVG Logo -->
<svg class="topBarLogo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 45">
  <g fill="#FF1A1A">
    <path d="M32.5 7.5 C 24.5 7.5 18 14 18 22 C 18 30 24.5 36.5 32.5 36.5 C 40.5 36.5 47 30 47 22 C 47 14 40.5 7.5 32.5 7.5 Z M 32.5 29 C 28.6 29 25.5 25.9 25.5 22 C 25.5 18.1 28.6 15 32.5 15 C 36.4 15 39.5 18.1 39.5 22 C 39.5 25.9 36.4 29 32.5 29 Z"/>

</svg><br>
<span id="wel" style="font-size:11px;color:#22c55e"></span>
<span id="welMc" style="font-size:11px;background:#1a243b;padding:2px 8px;border-radius:10px;border:1px solid #ff1a1a"></span>
<span id="welShift" style="font-size:11px;background:#eab308;color:#000;padding:2px 8px;border-radius:10px;font-weight:800"></span>
</div>
<div style="display:flex;gap:6px;align-items:center">
<span id="liveShiftBadge" style="font-size:10px;background:#eab308;color:#000;padding:5px 10px;border-radius:12px;font-weight:800">SHIFT: -</span>
<span style="font-size:10px;background:#22c55e;color:#000;padding:5px 10px;border-radius:12px;font-weight:800">LIVE</span>
<button onclick="resetAll()" style="font-size:10px;background:#ff1a1a;color:#fff;padding:8px 12px;border-radius:8px;border:none;font-weight:800">RESET ALL</button>
<button onclick="doLogout()" style="font-size:10px;background:#1e293b;color:#fff;padding:8px 12px;border-radius:8px;border:none;font-weight:700">LOGOUT</button>
</div>
</div>

<div class="seriesBar">
<button class="sBtn active" onclick="setSeries('ALL')" id="btnALL">ALL (69)</button>
<button class="sBtn" onclick="setSeries('EN')" id="btnEN">EN (35)</button>
<button class="sBtn" onclick="setSeries('MK')" id="btnMK">MK (8)</button>
<button class="sBtn" onclick="setSeries('M')" id="btnM">M (15)</button>
<button class="sBtn" onclick="setSeries('L')" id="btnL">L (4)</button>
<button class="sBtn" onclick="setSeries('PN')" id="btnPN">PN (4)</button>
<button class="sBtn" onclick="setSeries('BR')" id="btnBR">BR (3)</button>
</div>

</div>

<div id="operatorBox" style="margin:10px 0;font-size:12px;color:#94a3b8"></div>

<div id="routeInfo" style="margin-top:12px;padding:12px;background:#1e1402;border:1px dashed #eab308;border-radius:10px;display:none;font-size:12px;line-height:1.6"></div>

</div>
</div>

<div class="deptHeader">
<div>
<div class="deptTitle" id="deptTitle">DEPARTMENT</div>
<div style="font-size:10px;color:#22c55e;margin-top:2px;font-weight:700">BREMBO • LIVE</div>
</div>
<div style="display:flex;gap:6px;align-items:center">
<span class="deptBadge" id="deptBadge"></span>
<button onclick="departmentLogout()" style="background:#1e293b;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:11px;font-weight:800">LOGOUT</button>
</div>
</div>

<div class="deptContent">
<div class="deptStats">
<div class="deptStat active" id="deptCardALL" onclick="setDeptStatusFilter('ALL')">
<small>TOTAL MACHINES</small>
<b id="deptTotal">69</b>
</div>
<div class="deptStat" id="deptCardRUNNING" onclick="setDeptStatusFilter('RUNNING')">

</div>

<div class="seriesBar" style="margin-bottom:12px;border-radius:12px;">
<button class="sBtn active" onclick="setDeptSeries('ALL')" id="deptBtnALL">ALL (69)</button>
<button class="sBtn" onclick="setDeptSeries('EN')" id="deptBtnEN">EN (35)</button>
<button class="sBtn" onclick="setDeptSeries('MK')" id="deptBtnMK">MK (8)</button>
<button class="sBtn" onclick="setDeptSeries('M')" id="deptBtnM">M (15)</button>
<button class="sBtn" onclick="setDeptSeries('L')" id="deptBtnL">L (4)</button>
<button class="sBtn" onclick="setDeptSeries('PN')" id="deptBtnPN">PN (4)</button>
<button class="sBtn" onclick="setDeptSeries('BR')" id="deptBtnBR">BR (3)</button>
</div>

<div class="deptMachineBox">
<div style="font-size:14px;font-weight:800" id="deptGridTitle">SELECT MACHINE</div>

<div id="deptMachineGrid" class="deptMachineGrid"></div>
</div>

<div class="deptMachineBox">
<div style="font-size:14px;font-weight:800">SELECTED MACHINE</div>
<div id="deptSelected" class="deptSelected"></div>
</div>
</div>
</div>

function getCurrentShift(){
const t=new Date().getHours()*60+new Date().getMinutes();
if(t>=465 && t<975) return "A";
if(t>=975 && t<1440) return "B";
return "C";
}

function getShiftRange(s){
if(s=="A") return "7:45 AM - 4:15 PM";
if(s=="B") return "4:15 PM - 12:00 AM";
return "12:00 AM - 7:45 AM";
}

function checkShiftAutoReset(){
let saved=localStorage.getItem("brembo_shift");
let live=getCurrentShift();
const badge=document.getElementById("liveShiftBadge");
if(badge) badge.innerText="SHIFT: "+live;

const at=document.getElementById("autoShiftTxt");
if(at) at.innerText="Current Running Shift: "+live+" ("+getShiftRange(live)+") Auto";

if(saved && saved!==live){
alert("Shift "+saved+" Ended! Shift "+live+" Started. Auto Resetting System & Logging Out.");
let resetData={};
ALL_MACHINES_LIST.forEach(id=>{
resetData[id]={status:"RUNNING",op:null};
});
db.ref("machines").set(resetData).then(()=>{
localStorage.clear();
location.reload();
});
return true;
}
return false;
}

function load(){
db.ref("machines").on("value",s=>{
let d=s.val();
let all=getAllMachines();
if(d){
let needSave=false;
for(let k in all){ if(!d[k]){ d[k]=all[k]; needSave=true; } }
for(let k in d){ if(k.includes("-")){ delete d[k]; needSave=true; } }
machines=d;
if(needSave) save();
for(let id in d){
if(prev[id] && prev[id].status!=d[id].status){
let who=d[id].op?d[id].op.name:"Someone";
let route=ROUTE_MAP[d[id].status]||ROUTE_MAP["RUNNING"];
loudPopup(id,d[id].status,who,route);
}
}
prev=JSON.parse(JSON.stringify(d));
const fb=document.getElementById("fbStat");
if(fb) fb.innerText="LIVE - "+Object.keys(machines).length+" M/C";
render();
renderDepartmentDashboard();
}else{
machines=getAllMachines();
save();
}
});
}

function departmentUpdateStatus(status){
if(!department){ alert("Department login required."); return; }
const config=DEPARTMENT_CONFIG[department];

const allowed=config.actions.some(a=>a.status===status);
if(!allowed){ alert("Access denied. This action is not allowed for your department."); return; }

if(!deptSelectedMachine){ alert("Please select a machine first."); return; }
const id=deptSelectedMachine;

if(!confirm(`Mark ${id} as ${status}?`)) return;

machines[id].status=status;

if(status === "RUNNING"){
machines[id].materialDetails = null;
}

save();

let route=ROUTE_MAP[status] || ROUTE_MAP["RUNNING"];
let who=department.toUpperCase()+" DEPARTMENT";
loudPopup(id,status,who,route);

if(status!=="RUNNING"){
let msg=`*🚨 BREMBO ALERT*%0A%0AMachine: ${id}%0AStatus: *${status}*%0ADepartment: ${config.name}%0ATime: ${new Date().toLocaleString("en-IN")}%0A%0AAction Required By: ${route.name}`;
lastWa=`https://wa.me/${route.no}?text=${msg}`;
setTimeout(()=>{ window.open(lastWa,"_blank"); },700);
}

renderDepartmentDashboard();
}

executeStatusUpdate(s);

return;
}

machines[curMachine].materialDetails = {
partNo: partNo,
partName: partName,
qty: qty
};

closeMaterialModal();
executeStatusUpdate("MATERIAL SHORTAGE");
}

function executeStatusUpdate(s){
machines[curMachine].status=s;
save();

let route=ROUTE_MAP[s] || ROUTE_MAP["RUNNING"];
loudPopup(curMachine,s,operator.name,route);

let date=new Date().toLocaleString("en-IN");
let matInfo = "";
if(s === "MATERIAL SHORTAGE" && machines[curMachine].materialDetails){
let mDet = machines[curMachine].materialDetails;
matInfo = `%0A%0A*📦 MATERIAL DETAILS:*%0APart No: ${mDet.partNo}%0APart Name: ${mDet.partName}%0AQty: ${mDet.qty}`;
}

let msg=`*🚨 BREMBO ALERT*%0A%0AMachine: ${curMachine}%0AStatus: *${s}*${matInfo}%0AOperator: ${operator.name}%0AID: ${operator.id}%0AShift: ${operator.shift} (${getShiftRange(operator.shift)})%0ATime: ${date}%0A%0AAction Required By: ${route.name}`;
lastWa=`https://wa.me/${route.no}?text=${msg}`;

document.getElementById("routeInfo").style.display="block";
document.getElementById("routeInfo").innerHTML=`<b>WhatsApp will go to:</b><br>👉 ${route.name}<br>📱 ${route.no}`;
document.getElementById("waBtn").style.display="block";
document.getElementById("waBtn").innerText=`SEND TO ${route.name.toUpperCase()}`;

setTimeout(()=>{ window.open(lastWa,"_blank"); },700);

renderCards();
renderList();
}

function render(){
if(!operator && !department) return;

if(operator){
document.getElementById("operatorDashboard").style.display="block";
document.getElementById("departmentDashboard").style.display="none";
renderCards();
renderList();
if(curMachine) sel(curMachine);
}

if(department){
document.getElementById("operatorDashboard").style.display="none";
document.getElementById("departmentDashboard").style.display="block";
renderDepartmentDashboard();
}
}

fillMachineDropdown();
load();

let savedOperator=localStorage.getItem("brembo_v7");
let savedDepartment=localStorage.getItem("brembo_department");

if(savedDepartment){
if(DEPARTMENT_CONFIG[savedDepartment]){
department=savedDepartment;
operator=null;
document.getElementById("login").style.display="none";
document.getElementById("operatorDashboard").style.display="none";
document.getElementById("departmentDashboard").style.display="block";
deptSelectedMachine=ALL_MACHINES_LIST[0];
renderDepartmentDashboard();
}
}else if(savedOperator){
try{
operator=JSON.parse(savedOperator);
if(!operator.machine){
document.getElementById("login").style.display="flex";
localStorage.removeItem("brembo_v7");
}else{
if(!checkShiftAutoReset()){
document.getElementById("login").style.display="none";
document.getElementById("operatorDashboard").style.display="block";
applyOperator();
}
}
}catch(e){
localStorage.removeItem("brembo_v7");
}
}

if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
