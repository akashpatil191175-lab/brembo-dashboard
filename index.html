<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brembo Machine & Material Management</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    /* =========================================================
       CSS STYLING
    ========================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f1115; color: #f1f5f9; padding: 15px; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Login Screen Styles */
    #login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
    .login-card { background: #181c24; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #2d3748; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .login-card h2 { margin-bottom: 20px; color: #ffd000; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #a0aec0; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4a5568; background: #0f1115; color: #fff; }
    .btn { width: 100%; padding: 12px; background: #22c55e; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #16a34a; }

    /* Dashboard Styles */
    #operatorDashboard, #departmentDashboard { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #181c24; padding: 15px; border-radius: 10px; border: 1px solid #2d3748; }
    .status-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .card { background: #181c24; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #2d3748; cursor: pointer; }
    .card.active { border-color: #ffd000; background: #221e08; }
    
    /* Material Request Cards & Panels */
    .materialRequestCard { background: #181c24; border: 1px solid #2d3748; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    .materialRequestCard.pending { border-left: 4px solid #eab308; }
    .materialRequestCard.action { border-left: 4px solid #22c55e; }
    .materialRequestTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .requestId { font-weight: bold; color: #ffd000; font-size: 14px; }
    .requestStatus { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .requestStatus.pending { background: #422006; color: #facc15; }
    .requestStatus.shortage { background: #450a0a; color: #f87171; }
    .requestStatus.action { background: #052e16; color: #4ade80; }
    
    .materialRequestGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; font-size: 11px; }
    .materialRequestInfo { background: #0f1115; padding: 6px; border-radius: 4px; border: 1px solid #21262d; }
    .materialRequestInfoLabel { color: #8b949e; font-size: 9px; }
    .materialRequestInfoValue { color: #f0f6fc; font-weight: bold; margin-top: 2px; }
    
    .materialActionRow { display: flex; gap: 10px; margin-top: 12px; }
    .materialActionBtn { flex: 1; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; border: none; }
    .materialSupplyBtn { background: #166534; color: #fff; }
    .materialSupplyBtn:hover { background: #15803d; }
    .materialShortageBtn { background: #991b1b; color: #fff; }
    .materialShortageBtn:hover { background: #b91c1c; }
    .materialHistoryNote { margin-top: 10px; font-size: 10px; color: #8b949e; background: #0f1115; padding: 8px; border-radius: 4px; }

    /* Department Machine Grid */
    .deptMachineGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
    .deptMachine { background: #181c24; border: 1px solid #2d3748; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }
    .deptMachine.selected { border-color: #ffd000; background: #221e08; }
    .deptMachineStatus { font-size: 10px; margin-top: 4px; display: block; font-weight: bold; }
    
    .viewBox { background: #181c24; border: 1px solid #2d3748; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 12px; }
    .viewOnly { background: #1e1b4b; border: 1px solid #312e81; padding: 12px; border-radius: 8px; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- =========================================================
       LOGIN SCREEN
    ========================================================= -->
    <div id="login">
      <div class="login-card">
        <h2>BREMBO SYSTEM LOGIN</h2>
        
        <div class="form-group">
          <label>Select Login Type</label>
          <select id="loginType" onchange="toggleLoginInputs()">
            <option value="operator">Operator Login</option>
            <option value="department">Department Login</option>
          </select>
        </div>

        <!-- Operator Login Form -->
        <div id="operatorLoginForm">
          <div class="form-group">
            <label>Operator ID / Name</label>
            <input type="text" id="opId" placeholder="Enter Operator ID">
          </div>
          <div class="form-group">
            <label>Machine No</label>
            <select id="opMachine">
              <!-- Dynamically populated -->
            </select>
          </div>
          <div class="form-group">
            <label>Shift</label>
            <select id="opShift">
              <option value="A">Shift A (07:00 AM - 03:30 PM)</option>
              <option value="B">Shift B (03:30 PM - 12:00 AM)</option>
              <option value="C">Shift C (12:00 AM - 07:00 AM)</option>
            </select>
          </div>
          <button class="btn" onclick="operatorLogin()">LOGIN AS OPERATOR</button>
        </div>

        <!-- Department Login Form -->
        <div id="departmentLoginForm" style="display:none;">
          <div class="form-group">
            <label>Department</label>
            <select id="departmentSelect">
              <option value="maintenance">Maintenance</option>
              <option value="quality">Quality</option>
              <option value="toolroom">Tool Room</option>
              <option value="loading">Loading / Logistics</option>
              <option value="store">Store Department</option>
              <option value="supervisor">Supervisor</option>
            </select>
          </div>
          <div class="form-group">
            <label>Department PIN</label>
            <input type="password" id="departmentPin" placeholder="Enter PIN">
          </div>
          <button class="btn" onclick="departmentLogin()">LOGIN AS DEPARTMENT</button>
        </div>

      </div>
    </div>

    <!-- =========================================================
       OPERATOR DASHBOARD
    ========================================================= -->
    <div id="operatorDashboard">
      <div class="header">
        <div>
          <h3>Operator Dashboard</h3>
          <p id="operatorInfoDisplay" style="font-size: 11px; color: #a0aec0;"></p>
        </div>
        <button class="btn" style="width: auto; padding: 8px 15px; background: #ef4444;" onclick="operatorLogout()">LOGOUT</button>
      </div>

      <div class="status-cards" id="operatorStatusCards">
        <!-- Rendered dynamically -->
      </div>

      <div style="background: #181c24; padding: 15px; border-radius: 8px; border: 1px solid #2d3748;">
        <h4>Assigned Machine Control</h4>
        <div id="machineControlPanel" style="margin-top: 10px;">
          <!-- Active machine info & updates -->
        </div>
      </div>
      
      <div id="routeInfo" style="display:none; margin-top: 15px; background: #181c24; padding: 12px; border-radius: 8px; border: 1px solid #ffd000;"></div>
      <button id="waBtn" style="display:none; margin-top: 10px;" class="btn" onclick="openWA()">◉ SEND WHATSAPP</button>
    </div>

    <!-- =========================================================
       DEPARTMENT DASHBOARD
    ========================================================= -->
    <div id="departmentDashboard">
      <div class="header">
        <div>
          <h3 id="deptTitle">DEPARTMENT DASHBOARD</h3>
          <span id="deptBadge" style="font-size: 10px; background: #3b82f6; padding: 2px 6px; border-radius: 4px;"></span>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn" style="width: auto; padding: 8px 12px; background: #3b82f6;" onclick="downloadShiftExcel()">📥 EXCEL REPORT</button>
          <button class="btn" style="width: auto; padding: 8px 12px; background: #ef4444;" onclick="departmentLogout()">LOGOUT</button>
        </div>
      </div>

      <!-- Status Filter Cards -->
      <div class="status-cards" id="departmentStatusCards"></div>

      <!-- Material Requirement Panel Toggle Button for Store -->
      <button id="materialRequirementBtn" style="display:none; margin-bottom: 15px; background: #eab308; color: #000;" class="btn" onclick="toggleMaterialRequirements()">
        📦 MATERIAL REQUEST PANEL (<span id="materialReqCount">0</span> PENDING)
      </button>

      <!-- Material Request Panel Container -->
      <div id="materialRequestPanel" style="display:none; background: #181c24; border: 1px solid #2d3748; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h4 style="color: #ffd000;">📦 PENDING MATERIAL REQUESTS</h4>
          <span id="materialTotalText" style="font-size: 11px; color: #8b949e;">0 TOTAL</span>
        </div>
        
        <div style="display: flex; gap: 5px; margin-bottom: 12px;">
          <button class="btn" id="materialPendingTab" onclick="setMaterialRequestView('PENDING')" style="background: #374151; font-size: 11px; padding: 6px;">PENDING</button>
          <button class="btn" id="materialHistoryTab" onclick="setMaterialRequestView('HISTORY')" style="background: #374151; font-size: 11px; padding: 6px;">HISTORY</button>
          <button class="btn" id="materialAllTab" onclick="setMaterialRequestView('ALL')" style="background: #374151; font-size: 11px; padding: 6px;">ALL</button>
        </div>

        <div id="materialRequestList">
          <!-- Request cards populated here -->
        </div>
      </div>

      <!-- Department Machine Grid -->
      <div style="background: #181c24; padding: 15px; border-radius: 8px; border: 1px solid #2d3748;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h4 id="deptGridTitle">⚙️ MACHINES</h4>
          <span id="deptGridCount" style="font-size: 11px; color: #8b949e;">0 MACHINES</span>
        </div>
        <div class="deptMachineGrid" id="deptMachineGrid"></div>
      </div>

      <!-- Selected Machine Info/Actions -->
      <div id="deptSelected" style="margin-top: 15px;"></div>
    </div>

  </div>

  <!-- Material Request Modal (Triggered by Operator) -->
  <div id="materialModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#181c24; padding:20px; border-radius:10px; width:90%; max-width:400px; border:1px solid #2d3748;">
      <h3 style="color:#ffd000; margin-bottom:15px;">New Material Request</h3>
      <div class="form-group">
        <label>Part Number</label>
        <input type="text" id="matPartNo" placeholder="Enter Part No">
      </div>
      <div class="form-group">
        <label>Part Name</label>
        <input type="text" id="matPartName" placeholder="Enter Part Name">
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" id="matQty" placeholder="Enter Quantity">
      </div>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn" style="background:#6b7280;" onclick="closeMaterialModal()">CANCEL</button>
        <button class="btn" onclick="submitMaterialRequest()">SUBMIT REQUEST</button>
      </div>
    </div>
  </div>

  <!-- =========================================================
     JAVASCRIPT LOGIC
  ========================================================= -->
  <script>
    // Firebase Configuration Placeholder (Replace with your actual Firebase config)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Global Constants & State Variables
    const ALL_MACHINES_LIST = ["MC-01", "MC-02", "MC-03", "MC-04", "MC-05", "MC-06", "MC-07", "MC-08", "MC-09", "MC-10"];
    
    const DEPARTMENT_CONFIG = {
      maintenance: { name: "Maintenance", pin: "1234", actions: [{ label: "✅ RESOLVE BREAKDOWN", status: "RUNNING" }] },
      quality: { name: "Quality", pin: "2345", actions: [{ label: "✅ APPROVE CMM / SIGN", status: "RUNNING" }] },
      toolroom: { name: "Tool Room", pin: "3456", actions: [{ label: "✅ APPROVE FIXTURE", status: "RUNNING" }] },
      loading: { name: "Loading", pin: "4567", actions: [{ label: "✅ LOT CLEARED", status: "RUNNING" }] },
      store: { name: "Store Department", pin: "5678", actions: [] },
      supervisor: { name: "Supervisor", pin: "7890", actions: [{ label: "✅ RELEASE HOLD", status: "RUNNING" }] }
    };

    const ROUTE_MAP = {
      "RUNNING": { name: "Production Floor", no: "910000000000" },
      "BREAKDOWN": { name: "Maintenance Dept", no: "919999999999" },
      "CMM NOT OK": { name: "Quality Dept", no: "918888888888" },
      "SIGN PENDING": { name: "Quality Dept", no: "918888888888" },
      "FIXTURE NOT OK": { name: "Tool Room", no: "917777777777" },
      "MATERIAL REQUIREMENT": { name: "Store Dept", no: "916666666666" },
      "LOT HOLD": { name: "Supervisor", no: "915555555555" }
    };

    let machines = {};
    let materialRequests = {};
    let operator = null;
    let department = null;
    let curMachine = null;
    let lastWa = null;
    let departmentStatusFilter = "TOTAL";
    let deptSelectedMachine = null;
    let materialRequirementMode = false;
    let materialRequestView = "PENDING";

    // Initialize Machine Dropdown on Login Screen
    function fillMachineDropdown() {
      const select = document.getElementById("opMachine");
      select.innerHTML = ALL_MACHINES_LIST.map(id => `<option value="${id}">${id}</option>`).join("");
    }

    function toggleLoginInputs() {
      const type = document.getElementById("loginType").value;
      if (type === "operator") {
        document.getElementById("operatorLoginForm").style.display = "block";
        document.getElementById("departmentLoginForm").style.display = "none";
      } else {
        document.getElementById("operatorLoginForm").style.display = "none";
        document.getElementById("departmentLoginForm").style.display = "block";
      }
    }

    function getDefaultMachine() {
      return { status: "RUNNING", op: null };
    }

    // Load Data from Firebase
    function loadMachines() {
      db.ref("machines").on("value", snapshot => {
        machines = snapshot.val() || {};
        renderAllDashboards();
      });
    }

    function loadMaterialRequests() {
      db.ref("materialRequests").on("value", snapshot => {
        materialRequests = snapshot.val() || {};
        renderAllDashboards();
      });
    }

    // Shift Range Helper
    function getShiftRange(shift) {
      if (shift === "A") return "07:00 AM - 03:30 PM";
      if (shift === "B") return "03:30 PM - 12:00 AM";
      return "12:00 AM - 07:00 AM";
    }

    // Operator Login Logic
    function operatorLogin() {
      const id = document.getElementById("opId").value.trim();
      const machine = document.getElementById("opMachine").value;
      const shift = document.getElementById("opShift").value;

      if (!id) {
        alert("Please enter Operator ID.");
        return;
      }

      operator = { id, name: id, machine, shift, time: new Date().toLocaleTimeString("en-IN") };
      curMachine = machine;

      localStorage.setItem("brembo_v7", JSON.stringify(operator));
      localStorage.removeItem("brembo_department");

      document.getElementById("login").style.display = "none";
      document.getElementById("operatorDashboard").style.display = "block";

      // Assign operator to machine in state
      if (!machines[machine]) machines[machine] = getDefaultMachine();
      machines[machine].op = operator;
      saveMachine(machine);

      renderAllDashboards();
    }

    function operatorLogout() {
      if (!confirm("Are you sure you want to logout?")) return;
      localStorage.removeItem("brembo_v7");
      operator = null;
      location.reload();
    }

    // Department Login Logic
    function departmentLogin() {
      const dep = document.getElementById("departmentSelect").value;
      const pin = document.getElementById("departmentPin").value;
      const config = DEPARTMENT_CONFIG[dep];

      if (!pin || pin !== config.pin) {
        alert("Wrong Department PIN! Access Denied!");
        return;
      }

      department = dep;
      operator = null;
      localStorage.setItem("brembo_department", dep);
      localStorage.removeItem("brembo_v7");

      document.getElementById("login").style.display = "none";
      document.getElementById("departmentDashboard").style.display = "block";
      renderDepartmentDashboard();
    }

    function departmentLogout() {
      localStorage.removeItem("brembo_department");
      department = null;
      location.reload();
    }

    function saveMachine(id) {
      return db.ref("machines/" + id).set(machines[id]);
    }

    // Shift Auto Reset (Check 7 AM / 3:30 PM / 12 AM shifts boundary if needed)
    function checkShiftAutoReset() {
      return false; // Handled dynamically
    }

    // Status Cards Renderer for Operator
    function renderOperatorStatusCards() {
      const statuses = [
        { label: "RUNNING", color: "#22c55e" },
        { label: "BREAKDOWN", color: "#ef4444" },
        { label: "CMM NOT OK", color: "#0099ff" },
        { label: "FIXTURE NOT OK", color: "#c83cff" },
        { label: "MATERIAL REQUIREMENT", color: "#eab308" },
        { label: "LOT HOLD", color: "#ffd000" }
      ];

      const container = document.getElementById("operatorStatusCards");
      container.innerHTML = statuses.map(s => `
        <div class="card ${machines[curMachine]?.status === s.label ? 'active' : ''}" onclick="upd('${s.label}')">
          <div style="font-weight: bold; color: ${s.color}; font-size: 12px;">${s.label}</div>
        </div>
      `).join("");
    }

    function renderOperatorMachineList() {
      const m = machines[curMachine] || getDefaultMachine();
      document.getElementById("operatorInfoDisplay").innerText = `Machine: ${curMachine} | Assigned Operator: ${operator.name} (Shift ${operator.shift})`;
      
      document.getElementById("machineControlPanel").innerHTML = `
        <p>Current Status: <b style="color: #ffd000">${m.status}</b></p>
        <p style="font-size: 11px; color: #8b949e; margin-top: 5px;">Select a status card above to change machine status or request materials.</p>
      `;
    }

    function upd(status) {
      if (!operator) { document.getElementById("login").style.display = "flex"; return; }
      if (curMachine !== operator.machine) { alert("Access denied. Assigned machine only."); return; }
      if (status === "MATERIAL REQUIREMENT") { openMaterialModal(); return; }
      executeStatusUpdate(status);
    }

    function executeStatusUpdate(status) {
      if (!machines[curMachine]) machines[curMachine] = getDefaultMachine();
      machines[curMachine].status = status;

      saveMachine(curMachine).then(() => {
        const route = ROUTE_MAP[status] || ROUTE_MAP.RUNNING;
        const msg = `*🚨 BREMBO ALERT*%0A%0AMachine: ${encodeURIComponent(curMachine)}%0AStatus: *${encodeURIComponent(status)}*%0AOperator: ${encodeURIComponent(operator.name)}`;
        lastWa = `https://wa.me/${route.no}?text=${msg}`;

        document.getElementById("routeInfo").style.display = "block";
        document.getElementById("routeInfo").innerHTML = `<b>ROUTE INFO</b><br>Route To: ${escapeHtml(route.name)}<br>☎ +${escapeHtml(route.no)}`;
        document.getElementById("waBtn").style.display = "block";
        
        setTimeout(() => window.open(lastWa, "_blank"), 700);
        renderAllDashboards();
      }).catch(err => { console.error(err); alert("Firebase update failed."); });
    }

    // Material Request Modals & Operations
    function openMaterialModal() { document.getElementById("materialModal").style.display = "flex"; }
    function closeMaterialModal() { document.getElementById("materialModal").style.display = "none"; }

    function submitMaterialRequest() {
      const partNo = document.getElementById("matPartNo").value.trim();
      const partName = document.getElementById("matPartName").value.trim();
      const qty = document.getElementById("matQty").value.trim();

      if (!partNo || !qty) { alert("Please enter Part No and Quantity."); return; }

      const requestId = "REQ-" + Date.now();
      const now = new Date();

      const newReq = {
        requestId,
        machine: curMachine,
        partNo,
        partName,
        qty,
        status: "PENDING",
        requestedBy: operator.name,
        requestedById: operator.id,
        shift: operator.shift,
        createdDate: now.toLocaleString("en-IN"),
        actionTaken: false
      };

      db.ref("materialRequests/" + requestId).set(newReq).then(() => {
        closeMaterialModal();
        executeStatusUpdate("MATERIAL REQUIREMENT");
      }).catch(err => { console.error(err); alert("Material Request failed."); });
    }

    // Helpers for Material Requests
    function getAllMaterialRequestsSorted() {
      return Object.values(materialRequests).sort((a, b) => (b.actionAt || 0) - (a.actionAt || 0));
    }

    function getPendingMaterialRequests() {
      return Object.values(materialRequests).filter(r => r.status === "PENDING");
    }

    function getMachineMaterialRequests(machineId) {
      return Object.values(materialRequests).filter(r => r.machine === machineId);
    }

    function getMachinePendingMaterialRequests(machineId) {
      return Object.values(materialRequests).filter(r => r.machine === machineId && r.status === "PENDING");
    }

    // Material Request View Switcher
    function setMaterialRequestView(view) {
      materialRequestView = view;
      ['Pending', 'History', 'All'].forEach(t => document.getElementById(`material${t}Tab`)?.classList.remove("active"));
      document.getElementById(`material${view.charAt(0) + view.slice(1).toLowerCase()}Tab`)?.classList.add("active");
      renderMaterialRequestPanel();
    }

    function toggleMaterialRequirements() {
      if (department !== "store") return;
      materialRequirementMode = !materialRequirementMode;
      departmentStatusFilter = materialRequirementMode ? "MATERIAL REQUIREMENT" : "TOTAL";
      deptSelectedMachine = null;
      renderDepartmentDashboard();
    }

    // Render Material Request Panel in Store Dept
    function renderMaterialRequestPanel() {
      const panel = document.getElementById("materialRequestPanel");
      if (!panel || department !== "store" || !materialRequirementMode) { if(panel) panel.style.display = "none"; return; }
      
      panel.style.display = "block";
      const all = getAllMaterialRequestsSorted();
      const pending = all.filter(r => r.status === "PENDING");
      
      let list = materialRequestView === "PENDING" ? pending : materialRequestView === "HISTORY" ? all.filter(r => r.status !== "PENDING") : all;
      document.getElementById("materialTotalText").innerText = `${all.length} TOTAL • ${pending.length} PENDING`;
      
      const container = document.getElementById("materialRequestList");
      if (!list.length) {
        container.innerHTML = `<div style="text-align:center; color:#777; padding:20px; font-size:12px;">NO REQUESTS FOUND</div>`;
        return;
      }

      container.innerHTML = list.map(r => `
        <div class="materialRequestCard ${r.status === 'PENDING' ? 'pending' : 'action'}">
          <div class="materialRequestTop">
            <div>
              <div class="requestId">${escapeHtml(r.requestId)}</div>
              <div style="color:#aaa; font-size:10px;">Machine: <b style="color:#fff">${escapeHtml(r.machine)}</b></div>
            </div>
            <span class="requestStatus ${r.status === 'PENDING' ? 'pending' : 'action'}">${escapeHtml(r.status)}</span>
          </div>
          <div class="materialRequestGrid">
            <div class="materialRequestInfo"><div class="materialRequestInfoLabel">PART NO</div><div class="materialRequestInfoValue">${escapeHtml(r.partNo)}</div></div>
            <div class="materialRequestInfo"><div class="materialRequestInfoLabel">PART NAME</div><div class="materialRequestInfoValue">${escapeHtml(r.partName)}</div></div>
            <div class="materialRequestInfo"><div class="materialRequestInfoLabel">QUANTITY</div><div class="materialRequestInfoValue">${escapeHtml(r.qty)}</div></div>
            <div class="materialRequestInfo"><div class="materialRequestInfoLabel">DATE</div><div class="materialRequestInfoValue">${escapeHtml(r.createdDate || "-")}</div></div>
          </div>
          ${r.status === 'PENDING' ? `
            <div class="materialActionRow">
              <button class="materialActionBtn materialSupplyBtn" onclick="takeMaterialRequestAction('${escapeHtml(r.requestId)}','RUNNING')">✅ SUPPLIED</button>
              <button class="materialActionBtn materialShortageBtn" onclick="takeMaterialRequestAction('${escapeHtml(r.requestId)}','MATERIAL SHORTAGE')">❌ SHORTAGE</button>
            </div>
          ` : `
            <div class="materialHistoryNote"><b>ACTION:</b> ${escapeHtml(r.actionStatus || r.status)} | <b>BY:</b> ${escapeHtml(r.actionBy || "-")}</div>
          `}
        </div>
      `).join("");
    }

    function takeMaterialRequestAction(requestId, actionStatus) {
      if (department !== "store") return;
      const request = materialRequests[requestId];
      if (!request || request.status !== "PENDING") return;

      const now = new Date();
      const updatedRequest = {
        ...request,
        status: actionStatus === "RUNNING" ? "ACTION TAKEN" : "MATERIAL SHORTAGE",
        actionTaken: true,
        actionBy: DEPARTMENT_CONFIG[department].name,
        actionAt: now.getTime(),
        actionDate: now.toLocaleString("en-IN"),
        actionStatus: actionStatus === "RUNNING" ? "MATERIAL SUPPLIED" : "MATERIAL SHORTAGE"
      };

      db.ref("materialRequests/" + requestId).set(updatedRequest).then(() => {
        renderMaterialRequestPanel();
        renderDepartmentDashboard();
      }).catch(err => alert("Action failed."));
    }

    // Department Dashboard Renders
    function renderDepartmentDashboard() {
      if (!department) return;
      const config = DEPARTMENT_CONFIG[department];
      document.getElementById("deptTitle").innerText = config.name + " DASHBOARD";
      document.getElementById("deptBadge").innerText = config.name;

      renderDepartmentStatusCards();
      
      const matBtn = document.getElementById("materialRequirementBtn");
      const matCount = getPendingMaterialRequests().length;
      if (department === "store") {
        matBtn.style.display = "block";
        document.getElementById("materialReqCount").innerText = matCount;
      } else {
        matBtn.style.display = "none";
      }

      renderMaterialRequestPanel();
      renderDepartmentMachineGrid();
    }

    function renderDepartmentStatusCards() {
      const statuses = [
        { label: "TOTAL", color: "#3b82f6" },
        { label: "RUNNING", color: "#22c55e" },
        { label: "BREAKDOWN", color: "#ef4444" },
        { label: "MATERIAL REQUIREMENT", color: "#eab308" },
        { label: "LOT HOLD", color: "#ffd000" }
      ];
      document.getElementById("departmentStatusCards").innerHTML = statuses.map(s => `
        <div class="card ${departmentStatusFilter === s.label ? 'active' : ''}" onclick="setDepartmentStatusFilter('${s.label}')">
          <div style="font-weight: bold; color: ${s.color}; font-size: 11px;">${s.label}</div>
        </div>
      `).join("");
    }

    function setDepartmentStatusFilter(status) {
      departmentStatusFilter = status;
      materialRequirementMode = (status === "MATERIAL REQUIREMENT");
      deptSelectedMachine = null;
      renderDepartmentDashboard();
    }

    function getDepartmentFilteredMachines() {
      if (departmentStatusFilter === "TOTAL") return ALL_MACHINES_LIST.slice();
      if (departmentStatusFilter === "MATERIAL REQUIREMENT") {
        return [...new Set(getPendingMaterialRequests().map(r => r.machine))].filter(id => ALL_MACHINES_LIST.includes(id));
      }
      return ALL_MACHINES_LIST.filter(id => (machines[id] || getDefaultMachine()).status === departmentStatusFilter);
    }

    function renderDepartmentMachineGrid() {
      const grid = document.getElementById("deptMachineGrid");
      const filtered = getDepartmentFilteredMachines();
      document.getElementById("deptGridCount").innerText = filtered.length + " MACHINES";

      if (!filtered.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#777; padding:15px; font-size:12px;">NO MACHINES FOUND</div>`;
        deptSelectedMachine = null;
        renderDepartmentSelected();
        return;
      }

      if (!filtered.includes(deptSelectedMachine)) deptSelectedMachine = filtered[0];

      grid.innerHTML = filtered.map(id => `
        <div class="deptMachine ${deptSelectedMachine === id ? 'selected' : ''}" onclick="selectDepartmentMachine('${escapeHtml(id)}')">
          ${escapeHtml(id)}
          <span class="deptMachineStatus" style="color: #ffd000">${(machines[id] || getDefaultMachine()).status}</span>
        </div>
      `).join("");

      renderDepartmentSelected();
    }

    function selectDepartmentMachine(id) {
      deptSelectedMachine = id;
      renderDepartmentMachineGrid();
    }

    function renderDepartmentSelected() {
      const box = document.getElementById("deptSelected");
      if (!deptSelectedMachine) { box.innerHTML = ""; return; }

      const m = machines[deptSelectedMachine] || getDefaultMachine();
      const config = DEPARTMENT_CONFIG[department];

      let html = `<div class="viewBox"><h4>${escapeHtml(deptSelectedMachine)}</h4><p>Status: <b>${escapeHtml(m.status)}</b></p>`;

      if (department !== "store" && department !== "supervisor") {
        config.actions.forEach(act => {
          html += `<button class="btn" style="margin-top:10px; background:#166534;" onclick="departmentUpdateStatus('${act.status}')">${act.label}</button>`;
        });
      }
      html += `</div>`;
      box.innerHTML = html;
    }

    function departmentUpdateStatus(status) {
      if (!deptSelectedMachine) return;
      if (!machines[deptSelectedMachine]) machines[deptSelectedMachine] = getDefaultMachine();
      machines[deptSelectedMachine].status = status;

      saveMachine(deptSelectedMachine).then(() => renderDepartmentDashboard()).catch(err => alert("Update failed."));
    }

    // Excel Export
    function downloadShiftExcel() {
      try {
        const rows = ALL_MACHINES_LIST.map(id => {
          const m = machines[id] || getDefaultMachine();
          const op = m.op || {};
          return { "Machine": id, "Status": m.status, "Operator": op.name || "-" };
        });

        const worksheet = XLSX.utils.json_to_sheet(rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Machine Status");
        XLSX.writeFile(workbook, "Brembo_Report.xlsx");
      } catch (err) { alert("Excel export failed."); }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initialization on Startup
    fillMachineDropdown();
    loadMachines();
    loadMaterialRequests();

    // Check Existing Session
    const savedOperator = localStorage.getItem("brembo_v7");
    const savedDepartment = localStorage.getItem("brembo_department");

    if (savedDepartment && DEPARTMENT_CONFIG[savedDepartment]) {
      department = savedDepartment;
      document.getElementById("login").style.display = "none";
      document.getElementById("departmentDashboard").style.display = "block";
      renderDepartmentDashboard();
    } else if (savedOperator) {
      try {
        operator = JSON.parse(savedOperator);
        curMachine = operator.machine;
        document.getElementById("login").style.display = "none";
        document.getElementById("operatorDashboard").style.display = "block";
        renderAllDashboards();
      } catch (e) { localStorage.removeItem("brembo_v7"); }
    }
  </script>
</body>
</html>
