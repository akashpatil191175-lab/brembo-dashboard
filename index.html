<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; padding: 20px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title h2 { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .title p { font-size: 14px; color: #40c057; font-weight: bold; margin-top: 4px; }
    .header-btns { display: flex; gap: 10px; }
    .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; font-size: 14px; }
    .btn-red { background-color: #ff0033; color: white; }
    .btn-dark { background-color: #1c2541; color: #a0aec0; }

    /* Summary KPI Cards */
    .kpi-container { display: flex; gap: 15px; margin-bottom: 20px; }
    .kpi-card { flex: 1; background: #1c2541; padding: 18px; border-radius: 12px; text-align: center; cursor: pointer; border: 3px solid transparent; }
    .kpi-card:hover, .kpi-card.active { border-color: #4a90e2; }
    .kpi-title { font-size: 13px; color: #a0aec0; text-transform: uppercase; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
    .kpi-value { font-size: 36px; font-weight: 800; }
    .val-total { color: #ffffff; }
    .val-run { color: #40c057; }
    .val-issue { color: #ff0033; }

    /* Department Selector Horizontal Bar */
    .dept-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .dept-btn { background: #1c2541; color: #ffffff; border: 2px solid #3a506b; padding: 12px 22px; border-radius: 25px; font-size: 15px; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .dept-btn.active { background: #ff0033; color: white; border-color: #ff0033; }

    /* Section Area */
    .main-section { background: #151c33; border: 2px solid #2a3859; border-radius: 14px; padding: 20px; }
    .section-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; text-transform: uppercase; color: #ffffff; }

    /* Grid for Machines */
    .machine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-height: 480px; overflow-y: auto; padding-right: 5px; }
    .machine-card { background: #1c2541; border: 2px solid #2a3859; padding: 18px 10px; border-radius: 12px; text-align: center; cursor: pointer; }
    .machine-card.selected { border: 3px solid #ff0033; background: #222d4f; }
    .machine-name { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .status-tag { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; }
    .status-running { color: #40c057; }
    .status-breakdown { color: #ff0033; }
    .status-ready { color: #ff0033; }

    /* Selected Machine Control Box */
    .selected-box { margin-top: 20px; background: #151c33; border: 2px solid #2a3859; border-radius: 14px; padding: 20px; }
    .selected-name { font-size: 32px; font-weight: 800; margin-top: 6px; color: #ffffff; }
    .status-info { font-size: 16px; font-weight: 700; margin: 12px 0; }
    .operator-info { background: #1c2541; padding: 14px; border-radius: 8px; color: #a0aec0; font-size: 14px; font-weight: 800; margin-bottom: 20px; text-align: center; letter-spacing: 0.5px; }
    .action-btns { display: flex; gap: 15px; }
    .act-btn { flex: 1; padding: 16px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
    .act-on { background-color: #ff0033; color: white; }
    .act-off { background-color: #40c057; color: white; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="title">
      <h2>MAINTENANCE DASHBOARD</h2>
      <p>BREMBO V8 • LIVE</p>
    </div>
    <div class="header-btns">
      <button class="btn btn-red">MAINTENANCE</button>
      <button class="btn btn-dark">LOGOUT</button>
    </div>
  </div>

  <!-- KPI Filter Cards -->
  <div class="kpi-container">
    <div class="kpi-card" onclick="filterStatus('ALL')">
      <div class="kpi-title">Total Machines</div>
      <div class="kpi-value val-total" id="count-total">69</div>
    </div>
    <div class="kpi-card" onclick="filterStatus('RUNNING')">
      <div class="kpi-title">Running</div>
      <div class="kpi-value val-run" id="count-running">64</div>
    </div>
    <div class="kpi-card" onclick="filterStatus('BREAKDOWN')">
      <div class="kpi-title">Active Issue</div>
      <div class="kpi-value val-issue" id="count-issue">4</div>
    </div>
  </div>

  <!-- Department Selection Bar -->
  <div class="dept-bar" id="dept-bar"></div>

  <!-- Machine Grid View -->
  <div class="main-section">
    <div class="section-title" id="grid-title">SELECT MACHINE</div>
    <div class="machine-grid" id="machine-grid"></div>
  </div>

  <!-- Selected Machine Details Panel -->
  <div class="selected-box">
    <div class="kpi-title">SELECTED MACHINE</div>
    <div class="selected-name" id="selected-name">EN11</div>
    <div class="status-info">Current Status: <span id="selected-status" class="status-running">RUNNING</span></div>
    <div class="operator-info">NO OPERATOR ASSIGNED</div>
    
    <div class="kpi-title" style="margin-bottom: 10px;">MAINTENANCE ACTIONS</div>
    <div class="action-btns">
      <button class="act-btn act-on">BREAKDOWN ON</button>
      <button class="act-btn act-off">BREAKDOWN OFF</button>
    </div>
  </div>

  <script>
    const machines = [];
    const depts = [
      { code: 'EN', count: 35 },
      { code: 'MK', count: 8 },
      { code: 'M', count: 15 },
      { code: 'L', count: 4 },
      { code: 'PN', count: 4 },
      { code: 'BR', count: 3 }
    ];

    depts.forEach(d => {
      for(let i = 1; i <= d.count; i++) {
        let status = 'RUNNING';
        if(d.code === 'BR' && i <= 2) status = 'BREAKDOWN';
        if(d.code === 'EN' && i === 1) status = 'LOT READY';
        if(d.code === 'EN' && i === 3) status = 'BREAKDOWN';
        
        machines.push({
          id: `${d.code}${i}`,
          dept: d.code,
          status: status
        });
      }
    });

    let selectedDept = 'ALL';
    let selectedStatus = 'ALL';
    let activeMachine = 'EN11';

    function renderDeptBar() {
      const deptBar = document.getElementById('dept-bar');
      let html = `<button class="dept-btn ${selectedDept === 'ALL' ? 'active' : ''}" onclick="filterDept('ALL')">ALL (69)</button>`;
      
      depts.forEach(d => {
        html += `<button class="dept-btn ${selectedDept === d.code ? 'active' : ''}" onclick="filterDept('${d.code}')">${d.code} (${d.count})</button>`;
      });
      deptBar.innerHTML = html;
    }

    function renderGrid() {
      const grid = document.getElementById('machine-grid');
      grid.innerHTML = '';

      const filtered = machines.filter(m => {
        const matchDept = (selectedDept === 'ALL') || (m.dept === selectedDept);
        const matchStatus = (selectedStatus === 'ALL') || 
                            (selectedStatus === 'BREAKDOWN' && (m.status === 'BREAKDOWN' || m.status === 'LOT READY')) || 
                            (selectedStatus === 'RUNNING' && m.status === 'RUNNING');
        return matchDept && matchStatus;
      });

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = `machine-card ${m.id === activeMachine ? 'selected' : ''}`;
        
        let statusClass = 'status-running';
        if(m.status === 'BREAKDOWN') statusClass = 'status-breakdown';
        if(m.status === 'LOT READY') statusClass = 'status-ready';

        card.innerHTML = `
          <div class="machine-name">${m.id}</div>
          <div class="status-tag ${statusClass}">${m.status}</div>
        `;
        card.onclick = () => selectMachine(m);
        grid.appendChild(card);
      });
    }

    function filterDept(dept) {
      selectedDept = dept;
      renderDeptBar();
      renderGrid();
    }

    function filterStatus(status) {
      selectedStatus = status;
      renderGrid();
    }

    function selectMachine(m) {
      activeMachine = m.id;
      document.getElementById('selected-name').innerText = m.id;
      const statusEl = document.getElementById('selected-status');
      statusEl.innerText = m.status;
      statusEl.className = m.status === 'RUNNING' ? 'status-running' : 'status-breakdown';
      renderGrid();
    }

    renderDeptBar();
    renderGrid();
  </script>
</body>
</html>
