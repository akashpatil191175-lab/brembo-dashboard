const db=firebase.database();


/* =========================

const ADMIN_PIN="191197";

SUPERVISOR:{

/* =========================

const ROUTE_MAP={

"BREAKDOWN":{
name:"Pravin Kolhe Bbi (Maintenance)",
no:"919822431776"
},

"FIXTURE NOT OK":{
name:"Prashant Tarate (Tool Room)",
no:"917350090376"
},

"CMM NOT OK":{
name:"Santosh Shipurkar (Quality)",
no:"919921862590"
},

"LOT HOLD":{
name:"Mahesh Andhale (Supervisor)",
no:"919881097236"
},

"LOT READY":{
name:"Sonpal Ram (Loading)",
no:"919012683322"
},

"LOT CLEAR":{
name:"Sonpal Ram (Loading)",
no:"919012683322"
},

"SIGN PENDING":{
name:"Santosh Shipurkar (Quality)",
no:"919921862590"
},

"RUNNING":{
name:"Mahesh Andhale (Supervisor)",
no:"919881097236"
}

};


/* =========================
   SHIFT
========================= */

function getCurrentShift(){

const t=
new Date().getHours()*60+
new Date().getMinutes();

if(t>=465 && t<975)
return "A";

if(t>=975 && t<1440)
return "B";

return "C";

}


function getShiftRange(s){

if(s==="A")
return "7:45 AM - 4:15 PM";

if(s==="B")
return "4:15 PM - 12:00 AM";

return "12:00 AM - 7:45 AM";

}


/* =========================
   MACHINES
========================= */

const ALL_MACHINES_LIST=(()=>{

let a=[];

for(let i=1;i<=35;i++)
a.push("EN"+i);

[
"MK3",
"MK8",
"MK11",
"MK13",
"MK15",
"MK25",
"MK27",
"MK28"
].forEach(x=>a.push(x));

for(let i=1;i<=15;i++)
a.push("M"+i);

for(let i=1;i<=4;i++)
a.push("L"+i);

for(let i=1;i<=4;i++)
a.push("PN"+i);

for(let i=1;i<=3;i++)
a.push("BR"+i);

return a;

})();


let curSeries="ALL";
let curMachine=null;
let curFilter="ALL";
let operator=null;
let machines={};
let lastWa="";
let prev={};
let departmentUser=null;


/* =========================
   DEFAULT MACHINE DATA
========================= */

function getAllMachines(){

let m={};

ALL_MACHINES_LIST.forEach(
(id,idx)=>{

let s=
idx%7===1
?"BREAKDOWN":
idx%7===2
?"CMM NOT OK":
idx%7===3
?"FIXTURE NOT OK":
idx%7===4
?"LOT READY":
idx%7===5
?"LOT HOLD":
"RUNNING";

m[id]={
status:s,
op:null
};

});

return m;

}


/* =========================
   SAVE
========================= */

function save(){

return db
.ref("machines")
.set(machines);

}


/* =========================
   RESET
========================= */

function resetAll(){

let pin=
prompt("ENTER ADMIN PIN:");

if(pin===null)
return;

if(pin!==ADMIN_PIN){

alert(
"Wrong PIN! Access Denied!"
);

return;

}

if(
!confirm(
"Reset all 69 machines to RUNNING?"
)
)
return;

for(let k in machines){

machines[k]={
status:"RUNNING",
op:null
};

}

save();

alert(
"All 69 machines RUNNING!"
);

location.reload();

}


/* =========================
   BIG ALERT
========================= */

function loudPopup(
mid,
st,
who,
routeTo
){

const b=
document.getElementById(
"notifBig"
);

b.innerHTML=`

🚨 ${mid}

<br><br>

${st}

<br><br>

<span
style="
font-size:13px;
color:#ffeb3b
"
>
To: ${routeTo.name}
</span>

<br>

<span
style="font-size:11px"
>
By: ${who}
</span>

<br><br>

<button
onclick="
this.parentElement.style.display='none'
"
style="
padding:8px 20px;
border-radius:20px;
border:none;
font-weight:900;
background:#fff;
color:#ff1a1a
"
>
CLOSE
</button>

`;

b.style.display="block";

if(navigator.vibrate)
navigator.vibrate([
600,200,600,200,600
]);

setTimeout(
()=>{
b.style.display="none"
},
9000
);

}


/* =========================
   FIREBASE LIVE LOAD
========================= */

function load(){

db.ref("machines").on(
"value",
s=>{

let d=s.val();

let all=getAllMachines();

if(d){

let needSave=false;

for(let k in all){

if(!d[k]){

d[k]=all[k];
needSave=true;

}

}

for(let k in d){

if(
!ALL_MACHINES_LIST.includes(k)
){

delete d[k];
needSave=true;

}

}

machines=d;

if(needSave)
save();


for(let id in d){

if(
prev[id] &&
prev[id].status!==d[id].status
){

let who=
d[id].op
?d[id].op.name
:"Someone";

let route=
ROUTE_MAP[d[id].status]
||
ROUTE_MAP["RUNNING"];

loudPopup(
id,
d[id].status,
who,
route
);

}

}


prev=
JSON.parse(
JSON.stringify(d)
);


const stat=
document.getElementById(
"fbStat"
);

if(stat)
stat.innerText=
"LIVE - "+
Object.keys(machines).length+
" M/C";


if(!departmentUser)
render();

else
renderDepartmentContent();


}else{

machines=getAllMachines();

save();

}

});

}


/* =========================
   OPERATOR DROPDOWN
========================= */

function fillMachineDropdown(){

const sel=
document.getElementById(
"opMachine"
);

sel.innerHTML=
`
<option value="">
-- SELECT MACHINE --
</option>
`
+
ALL_MACHINES_LIST
.map(
m=>
`
<option value="${m}">
${m}
</option>
`
)
.join("");


document.getElementById(
"opShift"
).value=
getCurrentShift();

checkShiftAutoReset();

}


/* =========================
   OPERATOR LOGIN
========================= */

function doLogin(){

let id=
document.getElementById(
"opId"
).value.trim();

let nm=
document.getElementById(
"opName"
).value.trim();

let mc=
document.getElementById(
"opMachine"
).value;

let sh=
document.getElementById(
"opShift"
).value;


if(
!id ||
!nm ||
!mc ||
!sh
){

alert(
"Please fill ID, Name, Machine and Shift!"
);

return;

}


operator={
id:id,
name:nm,
machine:mc,
shift:sh,
time:new Date().toLocaleString()
};


localStorage.setItem(
"brembo_v7",
JSON.stringify(operator)
);

localStorage.setItem(
"brembo_shift",
sh
);

localStorage.setItem(
"brembo_login_time",
Date.now()
);


document.getElementById(
"login"
).style.display="none";


applyOperator();

}


/* =========================
   APPLY OPERATOR
========================= */

function applyOperator(){

if(!operator)
return;


document.getElementById(
"wel"
).innerText=
operator.name+
" ("+
operator.id+
")";


document.getElementById(
"welMc"
).innerText=
operator.machine;


document.getElementById(
"welShift"
).innerText=
"Shift "+
operator.shift;


document.getElementById(
"liveShiftBadge"
).innerText=
"SHIFT: "+
operator.shift;


curMachine=
operator.machine;


document.getElementById(
"lockMsg"
).innerText=
`You can only edit ${operator.machine}.`;


if(
machines[operator.machine]
){

machines[
operator.machine
].op={

name:operator.name,
id:operator.id,
time:new Date()
.toLocaleTimeString(),
machine:operator.machine,
shift:operator.shift

};

save();

}

render();

}


/* =========================
   OPERATOR LOGOUT
========================= */

function doLogout(){

if(
confirm(
"Logout? Next operator can login after this."
)
){

localStorage.removeItem(
"brembo_v7"
);

localStorage.removeItem(
"brembo_shift"
);

localStorage.removeItem(
"brembo_login_time"
);

operator=null;

location.reload();

}

}


/* =========================
   SHIFT AUTO RESET
========================= */

function checkShiftAutoReset(){

let saved=
localStorage.getItem(
"brembo_shift"
);

let live=
getCurrentShift();


const badge=
document.getElementById(
"liveShiftBadge"
);

if(badge)
badge.innerText=
"SHIFT: "+
live;


const at=
document.getElementById(
"autoShiftTxt"
);

if(at)
at.innerText=
"Current Running Shift: "+
live+
" ("+
getShiftRange(live)+
") Auto";


if(
saved &&
saved!==live
){

resetMachinesForNewShift();

return true;

}

return false;

}


/* =========================
   RESET SHIFT
========================= */

function resetMachinesForNewShift(){

for(let k in machines){

machines[k]={
status:"RUNNING",
op:null
};

}

db.ref("machines")
.set(machines)
.then(()=>{

localStorage.clear();

alert(
"Previous shift ended. New shift started. All machines reset."
);

location.reload();

});

}


setInterval(
checkShiftAutoReset,
30000
);


/* =========================
   SERIES
========================= */

function setSeries(series){

curSeries=series;

document
.querySelectorAll(".sBtn")
.forEach(
b=>b.classList.remove("active")
);

let btn=
document.getElementById(
"btn"+
series
);

if(btn)
btn.classList.add("active");

curFilter="ALL";

renderList();

}


/* =========================
   COUNTS
========================= */

function getCount(k){

if(k==="ALL")
return Object.keys(machines).length;

return Object.values(
machines
)
.filter(
m=>m.status===k
)
.length;

}


/* =========================
   CARDS
========================= */

function renderCards(){

let list=[

{
k:"ALL",
t:"TOTAL"
},

{
k:"RUNNING",
t:"RUN"
},

{
k:"BREAKDOWN",
t:"BREAK"
},

{

{

${

}
"
>
${getCount(x.k)}
</h2>

</div>

`
).join("");

}


/* =========================
   FILTER
========================= */

function setF(f){

curFilter=f;

renderList();

}


/* =========================
   MACHINE LIST
========================= */

function renderList(){

let ids=[];


if(curSeries==="ALL"){

ids=
curFilter==="ALL"
?
Object.keys(machines).sort()
:
Object.keys(machines)
.filter(
k=>
machines[k].status===curFilter
)
.sort();

}else{

ids=
Object.keys(machines)
.filter(
k=>
k.startsWith(curSeries)
)
.sort(
(a,b)=>{

let na=
parseInt(
a.replace(
/[^0-9]/g,
""
)
)||0;

let nb=
parseInt(
b.replace(
/[^0-9]/g,
""
)
)||0;

return na-nb;

}
);

if(curFilter!=="ALL"){

ids=
ids.filter(
k=>
machines[k].status===curFilter
);

}

}


document.getElementById(
"listTitle"
).innerText=
curSeries+
" ("+
ids.length+
") - "+
curFilter;


document.getElementById(
"machineList"
).innerHTML=
ids.map(
id=>{

let isMine=
operator &&
operator.machine===id;

let cls=
curMachine===id
?
"mItem active"
:
"mItem";

let star=
isMine
?
"⭐ "
:
"";


return `

<div
class="${cls}"
onclick="sel('${id}')"
>

<b>
${star}${id}
</b>

<span
style="
font-size:8px;
background:
${
machines[id].status==="RUNNING"
?"#22c55e"
:
machines[id].status==="LOT CLEAR"
?"#38bdf8"
:"#ef4444"
};
padding:3px 7px;
border-radius:10px;
color:#fff
"
>
${machines[id].status}
</span>

</div>

`;

}
).join("");


if(
ids.length &&
!curMachine
)
sel(ids[0]);

else if(curMachine)
sel(curMachine);

}

/* =========================

========================= */

function upd(s){

if(!operator){

document.getElementById(
"login"
).style.display="flex";

}


if(
curMachine!==operator.machine
){

alert(
`You can only send for ${operator.machine}!`
);

return;

}


machines[
curMachine
].status=s;

save();


let route=
ROUTE_MAP[s]
||
ROUTE_MAP["RUNNING"];


loudPopup(
curMachine,
s,
operator.name,
route
);


let date=
new Date()
.toLocaleString("en-IN");


let msg=
`*🚨 BREMBO ALERT V7*%0A%0A`+
`Machine: ${curMachine}%0A`+
`Status: *${s}*%0A`+
`Operator: ${operator.name}%0A`+
`ID: ${operator.id}%0A`+
`Shift: ${operator.shift} (${getShiftRange(operator.shift)})%0A`+
`Time: ${date}%0A%0A`+
`Action Required By: ${route.name}`;


lastWa=
`https://wa.me/${route.no}?text=${msg}`;


document.getElementById(
"routeInfo"
).style.display="block";

"routeInfo"
).innerHTML=
`

renderList();

}

return;


if(
departmentUser==="SUPERVISOR"
){

alert(
"Supervisor is View Only."
);

return;

}


/* BREAKDOWN */

if(
departmentUser==="BREAKDOWN" &&
status!=="BREAKDOWN" &&
status!=="RUNNING"
){

alert(
"Breakdown department can only use Breakdown ON/OFF."
);

return;

}


/* CMM */

if(
departmentUser==="CMM" &&
status!=="CMM NOT OK" &&
status!=="RUNNING"
){

alert(
"CMM department can only use CMM NOT OK/OK."
);

return;

}


/* FIXTURE */

if(
departmentUser==="FIXTURE" &&
status!=="FIXTURE NOT OK" &&
status!=="RUNNING"
){

alert(
"Fixture department can only use Fixture NOT OK/OK."
);

return;

}


/* LOADING */

if(
departmentUser==="LOADING" &&
status!=="LOT CLEAR"
){

alert(
"Loading department can only use LOT CLEAR."
);

return;

}


if(!machines[id]){

alert(
"Machine not found."
);

return;

}


machines[id].status=status;

machines[id].updatedAt=
new Date().toLocaleString(
"en-IN"
);


save();


let route=
ROUTE_MAP[status]
||
ROUTE_MAP["RUNNING"];


loudPopup(
id,
status,
DEPARTMENT_USERS[
departmentUser
].title,
route
);


renderDepartmentContent();

}


/* =========================================================
   DEPARTMENT LOGOUT
========================================================= */

function departmentLogout(){

if(
!confirm(
"Logout from department dashboard?"
)
)
return;


localStorage.removeItem(
"brembo_department"
);

localStorage.removeItem(
"brembo_department_shift"
);

departmentUser=null;

location.reload();

}


/* =========================================================
   DEPARTMENT SHIFT AUTO RESET
========================================================= */

function checkDepartmentShift(){

if(!departmentUser)
return;


let saved=
localStorage.getItem(
"brembo_department_shift"
);

let live=
getCurrentShift();


if(
saved &&
saved!==live
){

resetMachinesForNewShift();

}

}


setInterval(
checkDepartmentShift,
30000
);


/* =========================================================
   START
========================================================= */

fillMachineDropdown();

load();


/* =========================================================
   RESTORE OPERATOR
========================================================= */

let sv=
localStorage.getItem(
"brembo_v7"
);


if(sv){

try{

operator=
JSON.parse(sv);


if(
!operator.machine ||
!operator.id ||
!operator.name
){

localStorage.removeItem(
"brembo_v7"
);

operator=null;

document.getElementById(
"login"
).style.display="flex";

}else{

if(
!checkShiftAutoReset()
){

document.getElementById(
"login"
).style.display="none";

applyOperator();

}

}

}catch(e){

localStorage.removeItem(
"brembo_v7"
);

}

}


/* =========================================================
   RESTORE DEPARTMENT
========================================================= */

let savedDept=
localStorage.getItem(
"brembo_department"
);


if(savedDept){

if(
DEPARTMENT_USERS[
savedDept
]
){

departmentUser=
savedDept;


setTimeout(
()=>{

if(
!checkDepartmentShift()
){

renderDepartmentDashboard();

}

},
500
);

}else{

localStorage.removeItem(
"brembo_department"
);

}

}


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
"serviceWorker" in navigator
){

navigator.serviceWorker
.register("sw.js")
.then(
()=>{
console.log(
"Service Worker registered"
);
}
)
.catch(
err=>{
console.log(
"Service Worker error:",
err
);
}
);

}

</script>
